<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greencore Builders — Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
    header { background: #1a3c5e; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .sub { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }
    .refresh-btn { background: #2e8b6e; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; }
    .top-bar { background: #fff; padding: 12px 24px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .date-val { font-weight: 700; color: #1a3c5e; }
    .last-upd { font-size: 0.75rem; color: #999; margin-left: auto; }
    .summary-row { display: flex; gap: 16px; padding: 20px 24px 0; flex-wrap: wrap; }
    .sum-card { background: #fff; border-radius: 10px; padding: 16px 22px; flex: 1; min-width: 120px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); text-align: center; }
    .sum-card .num { font-size: 2rem; font-weight: 800; }
    .sum-card .lbl { font-size: 0.78rem; color: #777; margin-top: 2px; text-transform: uppercase; }
    .c-green { color: #2e8b6e; } .c-red { color: #e05252; } .c-blue { color: #1a3c5e; }
    .filter-row { padding: 16px 24px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    .fbtn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #ccc; background: #fff; font-size: 0.82rem; cursor: pointer; color: #555; }
    .fbtn.active { background: #1a3c5e; color: #fff; border-color: #1a3c5e; }
    .section { padding: 20px 24px; }
    .sec-title { font-size: 0.9rem; font-weight: 700; color: #1a3c5e; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .badge { background: #e8f4f0; color: #2e8b6e; border-radius: 10px; padding: 2px 8px; font-size: 0.78rem; font-weight: 700; }
    .badge.red { background: #fff0f0; color: #e05252; }
    .tbl-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px; }
    thead { background: #1a3c5e; color: #fff; }
    thead th { padding: 10px 14px; text-align: left; font-size: 0.78rem; }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:hover { background: #f8fbff; }
    td { padding: 10px 14px; color: #333; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    .pill-ok  { background: #e8f4f0; color: #2e8b6e; }
    .pill-out { background: #fff8e6; color: #c87800; }
    .pill-na  { background: #f5f5f5; color: #999; }
    .empty { text-align: center; padding: 40px; color: #aaa; font-size: 0.9rem; }
    .spinner-wrap { text-align: center; padding: 60px; }
    .spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid #ddd; border-top-color: #1a3c5e; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<header>
  <div>
    <div class="sub">LIVE ATTENDANCE DASHBOARD</div>
    <h1>Greencore Builders Inc.</h1>
  </div>
  <button class="refresh-btn" onclick="load()">⟳ Refresh</button>
</header>

<div class="top-bar">
  <span style="font-size:.85rem;color:#555">Date:</span>
  <span class="date-val" id="dateDisplay">—</span>
  <span class="last-upd" id="lastUpd"></span>
</div>

<div id="mainContent">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script>
const SCRIPT_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRYk5DXi3xant7bjtKGIzb1mBIEHSngAiRuTbRbc2AXiwIXGGlIr28ub0NquSDdMgSmOpO00CNXx4HE7OiUN7fdk0dUKxA6xQSUOwvu82xYjn4XxsO-ppNYMRT6X6jM0AV-qTQuFguWHn-xboLFfS2u8ax7e3tFELYZaE-1P8dW51u-7efuh7wDgKylMjvVG5GjGD71lsvTPv8omZ-QSNCHelGPODCDstgdXuh780uEuKQcBahsNNWEtN4U27bKBQWWu_qcMgqbVWqdLcRDWHInJKia7oCbDe9O5vpdwrjIxZqIJME&lib=MTQlJyvbyrrvR1Y_rjphUe-6QCVMeWvDg;

let allOn=[], allOut=[], activeSite='ALL', sites=[];

async function load() {
  document.getElementById('mainContent').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  try {
    const url  = SCRIPT_URL + '?action=getDashboard';
    const res  = await fetch(url, { redirect: 'follow' });
    const text = await res.text();
    const m    = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Bad response from server');
    const json = JSON.parse(m[0]);
    if (!json.success) throw new Error(json.message);
    allOn  = json.onSite  || [];
    allOut = json.outSite || [];
    const siteSet = new Set();
    [...allOn,...allOut].forEach(r => { if(r.site) siteSet.add(r.site); });
    sites = Array.from(siteSet).sort();
    document.getElementById('dateDisplay').textContent = json.date || '—';
    document.getElementById('lastUpd').textContent     = 'Updated: ' + new Date().toLocaleTimeString('en-PH');
    render();
  } catch(err) {
    document.getElementById('mainContent').innerHTML =
      `<div class="empty">❌ Cannot load data.<br><small>${err.message}</small></div>`;
  }
}

function render() {
  const on  = activeSite==='ALL' ? allOn  : allOn.filter(r=>r.site.includes(activeSite));
  const out = activeSite==='ALL' ? allOut : allOut.filter(r=>r.site.includes(activeSite));
  document.getElementById('mainContent').innerHTML = `
    <div class="summary-row">
      <div class="sum-card"><div class="num c-green">${on.length}</div><div class="lbl">On-Site</div></div>
      <div class="sum-card"><div class="num c-red">${out.length}</div><div class="lbl">Timed Out</div></div>
      <div class="sum-card"><div class="num c-blue">${on.length+out.length}</div><div class="lbl">Total Today</div></div>
    </div>
    <div class="filter-row">
      <button class="fbtn ${activeSite==='ALL'?'active':''}" onclick="filter('ALL')">All Sites</button>
      ${sites.map(s=>`<button class="fbtn ${activeSite===s?'active':''}" onclick="filter('${s}')">${s}</button>`).join('')}
    </div>
    <div class="section">
      <div class="sec-title">✅ Currently On-Site <span class="badge">${on.length}</span></div>
      <div class="tbl-wrap">${on.length===0?'<div class="empty">No workers currently on-site.</div>':
        `<table><thead><tr><th>Employee</th><th>ID</th><th>Site</th><th>Time-In</th><th>Distance</th><th>Remarks</th></tr></thead>
        <tbody>${on.map(r=>`<tr>
          <td>${r.employeeName}</td><td>${r.employeeId}</td><td>${r.site}</td>
          <td>${r.time}</td><td>${pill(r.distance,r.remarks)}</td>
          <td>${r.remarks.includes('FACE-MISMATCH')?'⚠️ Face Mismatch':''}</td>
        </tr>`).join('')}</tbody></table>`}
      </div>
    </div>
    <div class="section">
      <div class="sec-title">🚪 Timed Out Today <span class="badge red">${out.length}</span></div>
      <div class="tbl-wrap">${out.length===0?'<div class="empty">No timed-out records yet.</div>':
        `<table><thead><tr><th>Employee</th><th>ID</th><th>Site</th><th>Time-Out</th><th>Distance</th><th>Remarks</th></tr></thead>
        <tbody>${out.map(r=>`<tr>
          <td>${r.employeeName}</td><td>${r.employeeId}</td><td>${r.site}</td>
          <td>${r.time}</td><td>${pill(r.distance,r.remarks)}</td>
          <td>${r.remarks.includes('FACE-MISMATCH')?'⚠️ Face Mismatch':''}</td>
        </tr>`).join('')}</tbody></table>`}
      </div>
    </div>`;
}

function filter(site) { activeSite=site; render(); }

function pill(distance, remarks) {
  if (!distance) return '<span class="pill pill-na">N/A</span>';
  if (remarks && remarks.includes('OUT-OF-RANGE'))
    return `<span class="pill pill-out">⚠️ ${distance}</span>`;
  return `<span class="pill pill-ok">📍 ${distance}</span>`;
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
