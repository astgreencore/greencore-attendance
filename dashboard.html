<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greencore Builders — Live Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: #1a3c5e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .subtitle { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }
    .refresh-btn {
      background: #2e8b6e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .refresh-btn:active { opacity: 0.8; }

    .top-bar {
      background: #fff;
      padding: 12px 24px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .date-label { font-size: 0.85rem; color: #555; }
    .date-value { font-weight: 700; color: #1a3c5e; font-size: 0.95rem; }
    .last-update { font-size: 0.75rem; color: #999; margin-left: auto; }

    .summary-row {
      display: flex;
      gap: 16px;
      padding: 20px 24px 0;
      flex-wrap: wrap;
    }
    .summary-card {
      background: #fff;
      border-radius: 10px;
      padding: 16px 22px;
      flex: 1;
      min-width: 130px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      text-align: center;
    }
    .summary-card .num   { font-size: 2rem; font-weight: 800; }
    .summary-card .lbl   { font-size: 0.78rem; color: #777; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .on-num  { color: #2e8b6e; }
    .out-num { color: #e05252; }
    .all-num { color: #1a3c5e; }

    /* Site filter tabs */
    .filter-row {
      padding: 16px 24px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid #ccc;
      background: #fff;
      font-size: 0.82rem;
      cursor: pointer;
      color: #555;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: #1a3c5e;
      color: #fff;
      border-color: #1a3c5e;
    }

    .section {
      padding: 20px 24px;
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #1a3c5e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #e8f4f0;
      color: #2e8b6e;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .badge.red { background: #fff0f0; color: #e05252; }

    .table-wrap {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    thead { background: #1a3c5e; color: #fff; }
    thead th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: 0.78rem; letter-spacing: 0.3px; }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fbff; }
    td { padding: 10px 14px; color: #333; }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .pill.in  { background: #e6f9f0; color: #2e8b6e; }
    .pill.out { background: #fff0f0; color: #e05252; }
    .pill.range-ok      { background: #e8f4f0; color: #2e8b6e; }
    .pill.range-outside { background: #fff8e6; color: #c87800; }
    .pill.range-na      { background: #f5f5f5; color: #999; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 0.9rem;
    }

    .spinner-wrap {
      text-align: center;
      padding: 60px;
    }
    .spinner {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid #ddd;
      border-top-color: #1a3c5e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 10px; text-align: center; }
      .summary-row { padding: 16px 16px 0; gap: 10px; }
      .section { padding: 16px; }
      .filter-row { padding: 12px 16px 0; }
      td, thead th { padding: 8px 10px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="subtitle">LIVE ATTENDANCE DASHBOARD</div>
    <h1>Greencore Builders Inc.</h1>
  </div>
  <button class="refresh-btn" onclick="loadDashboard()">⟳ Refresh</button>
</header>

<div class="top-bar">
  <span class="date-label">Date:</span>
  <span class="date-value" id="dateDisplay">—</span>
  <span class="last-update" id="lastUpdate"></span>
</div>

<div id="mainContent">
  <div class="spinner-wrap"><div class="spinner"></div></div>
</div>

<script>
const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE'; // ← Replace after deploying Code.gs

let allOnSite  = [];
let allOutSite = [];
let activeSite = 'ALL';
let siteList   = [];

async function loadDashboard() {
  document.getElementById('mainContent').innerHTML =
    '<div class="spinner-wrap"><div class="spinner"></div></div>';

  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=getDashboard`);
    const json = await res.json();

    if (!json.success) throw new Error(json.message);

    allOnSite  = json.onSite  || [];
    allOutSite = json.outSite || [];

    // Collect unique sites
    const siteSet = new Set();
    [...allOnSite, ...allOutSite].forEach(r => { if (r.site) siteSet.add(r.site); });
    siteList = Array.from(siteSet).sort();

    document.getElementById('dateDisplay').textContent = json.date || '—';
    document.getElementById('lastUpdate').textContent  =
      'Last updated: ' + new Date().toLocaleTimeString('en-PH');

    renderDashboard();

  } catch (err) {
    document.getElementById('mainContent').innerHTML =
      `<div class="empty-state">❌ Cannot load data.<br><small>${err.message}</small></div>`;
  }
}

function renderDashboard() {
  const onSite  = activeSite === 'ALL' ? allOnSite  : allOnSite.filter(r => r.site.includes(activeSite));
  const outSite = activeSite === 'ALL' ? allOutSite : allOutSite.filter(r => r.site.includes(activeSite));
  const total   = onSite.length + outSite.length;

  let html = `
    <div class="summary-row">
      <div class="summary-card">
        <div class="num on-num">${onSite.length}</div>
        <div class="lbl">Currently On-Site</div>
      </div>
      <div class="summary-card">
        <div class="num out-num">${outSite.length}</div>
        <div class="lbl">Timed Out</div>
      </div>
      <div class="summary-card">
        <div class="num all-num">${total}</div>
        <div class="lbl">Total Today</div>
      </div>
    </div>

    <div class="filter-row">
      <button class="filter-btn ${activeSite === 'ALL' ? 'active' : ''}" onclick="filterSite('ALL')">All Sites</button>
      ${siteList.map(s => `
        <button class="filter-btn ${activeSite === s ? 'active' : ''}" onclick="filterSite('${s}')">${s}</button>
      `).join('')}
    </div>

    <div class="section">
      <div class="section-title">
        ✅ Currently On-Site
        <span class="badge">${onSite.length}</span>
      </div>
      <div class="table-wrap">
        ${onSite.length === 0
          ? '<div class="empty-state">No workers currently on-site.</div>'
          : `<table>
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>ID</th>
                  <th>Site</th>
                  <th>Time-In</th>
                  <th>Distance</th>
                </tr>
              </thead>
              <tbody>
                ${onSite.map(r => `
                  <tr>
                    <td>${r.employeeName}</td>
                    <td>${r.employeeId}</td>
                    <td>${r.site}</td>
                    <td>${r.time}</td>
                    <td>${rangePill(r.distance, r.remarks)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        🚪 Timed Out Today
        <span class="badge red">${outSite.length}</span>
      </div>
      <div class="table-wrap">
        ${outSite.length === 0
          ? '<div class="empty-state">No timed-out records yet.</div>'
          : `<table>
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>ID</th>
                  <th>Site</th>
                  <th>Time-Out</th>
                  <th>Distance</th>
                </tr>
              </thead>
              <tbody>
                ${outSite.map(r => `
                  <tr>
                    <td>${r.employeeName}</td>
                    <td>${r.employeeId}</td>
                    <td>${r.site}</td>
                    <td>${r.time}</td>
                    <td>${rangePill(r.distance, r.remarks)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>`
        }
      </div>
    </div>
  `;

  document.getElementById('mainContent').innerHTML = html;
}

function filterSite(site) {
  activeSite = site;
  renderDashboard();
}

function rangePill(distance, remarks) {
  if (!distance && !remarks) return '<span class="pill range-na">N/A</span>';
  if (remarks === 'OUT-OF-RANGE')
    return `<span class="pill range-outside">⚠️ ${distance || 'Out of range'}</span>`;
  if (remarks === 'GPS-UNAVAILABLE')
    return '<span class="pill range-na">No GPS</span>';
  return `<span class="pill range-ok">📍 ${distance || 'OK'}</span>`;
}

// Auto-refresh every 60 seconds
loadDashboard();
setInterval(loadDashboard, 60000);
</script>
</body>
</html>
