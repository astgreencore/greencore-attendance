<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Greencore Builders — Attendance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    header { width: 100%; background: #1a3c5e; color: #fff; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; }
    header p  { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 24px; margin: 20px 16px; width: 100%; max-width: 420px; }
    .site-badge { background: #e8f4f0; border: 2px solid #2e8b6e; border-radius: 8px; padding: 10px 16px; text-align: center; margin-bottom: 20px; }
    .site-badge .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    .site-badge .value { font-size: 1.1rem; font-weight: 700; color: #1a3c5e; margin-top: 2px; }
    h2 { font-size: 1rem; color: #1a3c5e; margin-bottom: 14px; text-align: center; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    .face-section { display: none; text-align: center; }
    .emp-confirm { background: #e8f4f0; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .emp-confirm .name { font-size: 1rem; font-weight: 700; color: #1a3c5e; }
    .emp-confirm .pos  { font-size: 0.8rem; color: #555; margin-top: 2px; }
    .camera-wrap { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; }
    .camera-wrap video { width: 100%; display: block; border-radius: 10px; }
    .face-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-55%);
      width: 180px; height: 220px; border: 3px solid rgba(46,139,110,0.8);
      border-radius: 50% 50% 45% 45%; pointer-events: none; }
    .face-tip { font-size: 0.8rem; color: #666; margin: 8px 0 12px; }
    .photo-compare { display: flex; gap: 10px; margin: 12px 0; }
    .photo-compare .pb { flex: 1; text-align: center; }
    .photo-compare img { width: 100%; border-radius: 8px; border: 2px solid #ddd; }
    .photo-compare .lbl { font-size: 0.72rem; color: #888; margin-top: 4px; }
    .match-status { font-size: 0.85rem; font-weight: 600; margin: 8px 0; min-height: 22px; }
    .match-ok  { color: #2e8b6e; }
    .match-bad { color: #e05252; }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1a3c5e; color: #fff; }
    .btn-green   { background: #2e8b6e; color: #fff; }
    .btn-gray    { background: #e0e0e0; color: #444; }
    .status-box { display: none; border-radius: 10px; padding: 18px; text-align: center; margin-top: 16px; }
    .status-box.success { background: #e6f9f0; border: 2px solid #2e8b6e; }
    .status-box.error   { background: #fff0f0; border: 2px solid #e05252; }
    .status-box.warning { background: #fffbe6; border: 2px solid #f0a500; }
    .status-icon  { font-size: 2.5rem; }
    .status-title { font-size: 1.2rem; font-weight: 700; margin: 6px 0 4px; color: #1a3c5e; }
    .status-name  { font-size: 0.95rem; color: #333; }
    .status-meta  { font-size: 0.82rem; color: #555; margin-top: 6px; white-space: pre-line; }
    .status-range { font-size: 0.8rem; margin-top: 8px; font-weight: 600; }
    .status-range.ok      { color: #2e8b6e; }
    .status-range.outside { color: #e05252; }
    .loading { text-align: center; padding: 20px; color: #888; font-size: 0.9rem; display: none; }
    .spinner { display: inline-block; width: 26px; height: 26px; border: 3px solid #ddd; border-top-color: #1a3c5e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { font-size: 0.75rem; color: #aaa; text-align: center; padding: 20px; }
  </style>
</head>
<body>
<header>
  <h1>GREENCORE BUILDERS INC.</h1>
  <p>Site Attendance System</p>
</header>

<div class="card">
  <div class="site-badge">
    <div class="label">Current Site</div>
    <div class="value" id="siteDisplay">Loading…</div>
  </div>

  <div id="qrSection">
    <h2>Scan Your Personal QR Code</h2>
    <div id="reader"></div>
  </div>

  <div class="face-section" id="faceSection">
    <h2>Face Verification</h2>
    <div class="emp-confirm">
      <div class="name" id="empNameDisplay">—</div>
      <div class="pos"  id="empPosDisplay">—</div>
    </div>
    <div class="camera-wrap">
      <video id="faceVideo" autoplay playsinline muted></video>
      <div class="face-overlay"></div>
    </div>
    <canvas id="faceCanvas" style="display:none;"></canvas>
    <p class="face-tip">Look at camera — tap Capture when ready</p>
    <button class="btn btn-green" id="captureBtn" onclick="captureFace()">📸 Capture & Verify</button>
    <button class="btn btn-gray"  onclick="skipFace()" style="margin-top:8px;">Skip Face Check</button>
    <div id="photoCompare" style="display:none;">
      <div class="photo-compare">
        <div class="pb"><img id="selfiePreview" src=""/><div class="lbl">Your Selfie</div></div>
        <div class="pb"><img id="refPreview"    src=""/><div class="lbl">Reference</div></div>
      </div>
      <div class="match-status" id="matchStatus"></div>
      <button class="btn btn-primary" onclick="confirmAttendance()">✅ Confirm Attendance</button>
      <button class="btn btn-gray"    onclick="retakeSelfie()" style="margin-top:8px;">🔄 Retake</button>
    </div>
  </div>

  <div class="loading" id="loadingBox">
    <div class="spinner"></div><br>
    <span id="loadingMsg">Processing…</span>
  </div>

  <div class="status-box" id="resultBox">
    <div class="status-icon"  id="resultIcon"></div>
    <div class="status-title" id="resultTitle"></div>
    <div class="status-name"  id="resultName"></div>
    <div class="status-meta"  id="resultMeta"></div>
    <div class="status-range" id="resultRange"></div>
    <button class="btn btn-primary" onclick="resetAll()" style="margin-top:14px;">Scan Next Person</button>
  </div>
</div>

<footer>Greencore Builders Inc. &copy; 2026</footer>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRYk5DXi3xant7bjtKGIzb1mBIEHSngAiRuTbRbc2AXiwIXGGlIr28ub0NquSDdMgSmOpO00CNXx4HE7OiUN7fdk0dUKxA6xQSUOwvu82xYjn4XxsO-ppNYMRT6X6jM0AV-qTQuFguWHn-xboLFfS2u8ax7e3tFELYZaE-1P8dW51u-7efuh7wDgKylMjvVG5GjGD71lsvTPv8omZ-QSNCHelGPODCDstgdXuh780uEuKQcBahsNNWEtN4U27bKBQWWu_qcMgqbVWqdLcRDWHInJKia7oCbDe9O5vpdwrjIxZqIJME&lib=MTQlJyvbyrrvR1Y_rjphUe-6QCVMeWvDg;

// ── MOBILE-SAFE FETCH ────────────────────────────────────────
// Uses no-cors workaround for GET, and proper POST for writes
async function apiFetch(params) {
  const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  const res  = await fetch(url, { redirect: 'follow' });
  const text = await res.text();
  // Strip any HTML wrapper if present
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error('Invalid server response');
  return JSON.parse(jsonMatch[0]);
}

async function apiPost(body) {
  const res  = await fetch(SCRIPT_URL, {
    method:  'POST',
    body:    JSON.stringify(body),
    headers: { 'Content-Type': 'text/plain' }
  });
  const text = await res.text();
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if (!jsonMatch) throw new Error('Invalid server response');
  return JSON.parse(jsonMatch[0]);
}

// ── STATE ────────────────────────────────────────────────────
const params   = new URLSearchParams(window.location.search);
const siteCode = params.get('site') || '';
let siteData = null, empData = null, qrScanner = null;
let faceStream = null, scanning = true;
let refPhoto = null, selfieData = null, faceMatched = false;

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  if (!siteCode) {
    document.getElementById('siteDisplay').textContent = 'No site code!';
    showError('No site code in URL. Please scan the correct site QR code.');
    return;
  }
  try {
    setLoading('Loading site…');
    const json = await apiFetch({ action: 'getSites' });
    if (!json.success) throw new Error(json.message);
    const site = json.sites.find(s => s.siteCode === siteCode);
    if (!site) throw new Error(`Site "${siteCode}" not found in Site List sheet.`);
    siteData = site;
    document.getElementById('siteDisplay').textContent = `${site.siteName} (${site.siteCode})`;
    hideLoading();
    startQRScanner();
  } catch(err) {
    showError('Cannot connect: ' + err.message);
  }
}

// ── QR SCANNER ───────────────────────────────────────────────
function startQRScanner() {
  document.getElementById('qrSection').style.display   = 'block';
  document.getElementById('faceSection').style.display = 'none';
  document.getElementById('resultBox').style.display   = 'none';
  document.getElementById('reader').innerHTML = '';
  scanning = true;
  qrScanner = new Html5Qrcode('reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onQRScanned, () => {}
  ).catch(() => showError('Camera access denied. Please allow camera and reload.'));
}

async function onQRScanned(token) {
  if (!scanning) return;
  scanning = false;
  if (qrScanner) { try { await qrScanner.stop(); } catch(e) {} }
  document.getElementById('reader').innerHTML = '';
  document.getElementById('qrSection').style.display = 'none';

  setLoading('Checking employee…');
  try {
    const json = await apiFetch({ action: 'getEmployee', token: token });
    hideLoading();
    if (!json.success) { showError(json.message); return; }
    empData = json;
    document.getElementById('empNameDisplay').textContent = json.employeeName;
    document.getElementById('empPosDisplay').textContent  = json.position + ' • ' + json.employeeId;

    if (!json.hasFacePhoto) {
      await submitAttendance('NOT-REGISTERED');
    } else {
      setLoading('Loading face data…');
      const fJson = await apiFetch({ action: 'getFacePhoto', employeeId: json.employeeId });
      hideLoading();
      if (!fJson.success) { await submitAttendance('NO-PHOTO'); return; }
      refPhoto = fJson.photo;
      showFaceSection();
    }
  } catch(err) {
    hideLoading();
    showError('Error: ' + err.message);
  }
}

// ── FACE SECTION ─────────────────────────────────────────────
async function showFaceSection() {
  document.getElementById('faceSection').style.display  = 'block';
  document.getElementById('photoCompare').style.display = 'none';
  document.getElementById('captureBtn').style.display   = 'block';
  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    document.getElementById('faceVideo').srcObject = faceStream;
  } catch(e) {
    showError('Cannot access front camera: ' + e.message);
  }
}

function captureFace() {
  const video = document.getElementById('faceVideo');
  const canvas = document.getElementById('faceCanvas');
  if (!video.videoWidth) return;
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  selfieData = canvas.toDataURL('image/jpeg', 0.85);
  if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); }
  document.getElementById('selfiePreview').src        = selfieData;
  document.getElementById('refPreview').src           = refPhoto;
  document.getElementById('captureBtn').style.display = 'none';
  faceMatched = compareFaces(selfieData, refPhoto);
  const el = document.getElementById('matchStatus');
  if (faceMatched) {
    el.textContent = '✅ Face matched!';
    el.className   = 'match-status match-ok';
  } else {
    el.textContent = '⚠️ Face mismatch — will be flagged for review';
    el.className   = 'match-status match-bad';
  }
  document.getElementById('photoCompare').style.display = 'block';
}

function retakeSelfie() {
  document.getElementById('photoCompare').style.display = 'none';
  document.getElementById('captureBtn').style.display   = 'block';
  selfieData = null; faceMatched = false;
  showFaceSection();
}

async function confirmAttendance() {
  if (!faceMatched && selfieData) {
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    apiPost({ action: 'saveMismatch', employeeId: empData.employeeId,
      employeeName: empData.employeeName, selfie: selfieData,
      reference: refPhoto, timestamp: ts }).catch(() => {});
  }
  await submitAttendance(faceMatched ? 'FACE-MATCH' : 'FACE-MISMATCH');
}

function skipFace() {
  if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); }
  submitAttendance('SKIPPED');
}

// ── FACE COMPARISON ──────────────────────────────────────────
function compareFaces(img1, img2) {
  try {
    const size = 128;
    const c1 = document.createElement('canvas');
    const c2 = document.createElement('canvas');
    const i1 = new Image(), i2 = new Image();
    i1.src = img1; i2.src = img2;
    c1.width = c1.height = c2.width = c2.height = size;
    const ctx1 = c1.getContext('2d'), ctx2 = c2.getContext('2d');
    ctx1.drawImage(i1, i1.width*0.2, i1.height*0.05, i1.width*0.6, i1.height*0.8, 0, 0, size, size);
    ctx2.drawImage(i2, i2.width*0.2, i2.height*0.05, i2.width*0.6, i2.height*0.8, 0, 0, size, size);
    const d1 = ctx1.getImageData(0,0,size,size).data;
    const d2 = ctx2.getImageData(0,0,size,size).data;
    const total = size * size;
    // Brightness histogram
    const bins = 32, h1 = new Array(bins).fill(0), h2 = new Array(bins).fill(0);
    for (let i = 0; i < d1.length; i += 4) {
      h1[Math.min(Math.floor((d1[i]*.299+d1[i+1]*.587+d1[i+2]*.114)/(256/bins)),bins-1)]++;
      h2[Math.min(Math.floor((d2[i]*.299+d2[i+1]*.587+d2[i+2]*.114)/(256/bins)),bins-1)]++;
    }
    let histScore = 0;
    for (let i = 0; i < bins; i++) histScore += Math.min(h1[i]/total, h2[i]/total);
    // Color averages
    let r1=0,g1=0,b1=0,r2=0,g2=0,b2=0;
    for (let i = 0; i < d1.length; i+=4) {
      r1+=d1[i];g1+=d1[i+1];b1+=d1[i+2];r2+=d2[i];g2+=d2[i+1];b2+=d2[i+2];
    }
    const colorScore = 1-(Math.abs(r1-r2)+Math.abs(g1-g2)+Math.abs(b1-b2))/(3*255*total);
    // Block comparison 4x4
    const bs = size/4; let blockScore = 0;
    for (let row=0; row<4; row++) for (let col=0; col<4; col++) {
      let a1=0,a2=0,cnt=0;
      for (let y=row*bs; y<(row+1)*bs; y++) for (let x=col*bs; x<(col+1)*bs; x++) {
        const idx=(y*size+x)*4;
        a1+=d1[idx]*.299+d1[idx+1]*.587+d1[idx+2]*.114;
        a2+=d2[idx]*.299+d2[idx+1]*.587+d2[idx+2]*.114; cnt++;
      }
      blockScore += 1-Math.abs(a1-a2)/(255*cnt);
    }
    blockScore /= 16;
    const score = histScore*0.35 + colorScore*0.35 + blockScore*0.30;
    console.log('Face score:', score.toFixed(3), '| hist:', histScore.toFixed(3), '| color:', colorScore.toFixed(3), '| block:', blockScore.toFixed(3));
    return score > 0.82;
  } catch(e) { console.error(e); return false; }
}

// ── SUBMIT ATTENDANCE ────────────────────────────────────────
async function submitAttendance(faceStatus) {
  document.getElementById('faceSection').style.display = 'none';
  setLoading('Recording attendance…');
  let latitude='', longitude='', distance='', remarks='';
  try {
    const pos = await getLocation();
    latitude  = pos.coords.latitude;
    longitude = pos.coords.longitude;
    distance  = calcDistance(latitude, longitude, siteData.latitude, siteData.longitude);
    remarks   = distance > siteData.radius ? 'OUT-OF-RANGE' : 'WITHIN-RANGE';
  } catch(e) { remarks = 'GPS-UNAVAILABLE'; }

  try {
    const json = await apiPost({
      action: 'logAttendance',
      employeeId:   empData.employeeId,
      employeeName: empData.employeeName,
      siteCode:     siteData.siteCode,
      siteName:     siteData.siteName,
      latitude, longitude,
      device:   navigator.userAgent.substring(0, 80),
      distance: distance ? Math.round(distance)+'m' : '',
      remarks, faceStatus
    });
    hideLoading();
    if (!json.success && json.blocked) {
      showBox('warning', '⏱️', 'Already '+json.lastAction, empData.employeeName, json.message, '');
      return;
    }
    if (!json.success) { showError(json.message); return; }
    const isMismatch = faceStatus === 'FACE-MISMATCH';
    const rangeText = distance !== ''
      ? (remarks==='OUT-OF-RANGE'
          ? `⚠️ OUT OF RANGE — ${Math.round(distance)}m (max ${siteData.radius}m)`
          : `📍 Within range — ${Math.round(distance)}m`)
      : '📍 GPS unavailable';
    showBox(
      isMismatch ? 'warning' : 'success',
      json.action==='TIME-IN' ? (isMismatch?'⚠️':'✅') : '🚪',
      json.action + (isMismatch?' — FACE MISMATCH':''),
      json.employeeName,
      `${json.siteName} • ${json.date} ${json.time}` + (isMismatch?'\n⚠️ Photos saved for review.':''),
      rangeText,
      remarks==='OUT-OF-RANGE' ? 'outside' : 'ok'
    );
  } catch(err) { hideLoading(); showError('Error: '+err.message); }
}

// ── DISPLAY HELPERS ──────────────────────────────────────────
function showBox(type, icon, title, name, meta, range, rangeClass) {
  const box = document.getElementById('resultBox');
  box.className = 'status-box '+type;
  document.getElementById('resultIcon').textContent  = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultName').textContent  = name;
  document.getElementById('resultMeta').textContent  = meta;
  const rangeEl = document.getElementById('resultRange');
  rangeEl.textContent = range || '';
  rangeEl.className   = 'status-range '+(rangeClass||'');
  box.style.display = 'block';
}

function showError(msg) {
  hideLoading();
  document.getElementById('qrSection').style.display   = 'none';
  document.getElementById('faceSection').style.display = 'none';
  showBox('error','❌','Error',msg,'','');
}

function setLoading(msg) {
  document.getElementById('loadingMsg').textContent   = msg||'Processing…';
  document.getElementById('loadingBox').style.display = 'block';
  document.getElementById('resultBox').style.display  = 'none';
}
function hideLoading() { document.getElementById('loadingBox').style.display = 'none'; }

function resetAll() {
  document.getElementById('resultBox').style.display   = 'none';
  document.getElementById('faceSection').style.display = 'none';
  empData=null; refPhoto=null; selfieData=null; faceMatched=false;
  if (faceStream) { faceStream.getTracks().forEach(t=>t.stop()); faceStream=null; }
  startQRScanner();
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('GPS not supported'));
    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
  });
}

function calcDistance(lat1,lon1,lat2,lon2) {
  const R=6371000,d1=lat1*Math.PI/180,d2=lat2*Math.PI/180;
  const dL=(lat2-lat1)*Math.PI/180,dO=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(d1)*Math.cos(d2)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

init();
</script>
</body>
</html>
